version: '3.9'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rockgame
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app

  redis:
    image: redis:7

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rockgame
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
